name: 推荐项目
description: 推荐一个用代码做动画、做 MV 的开源项目
title: "[推荐] "
labels: ["推荐项目"]
body:
  - type: input
    id: repo
    attributes:
      label: 仓库地址
      placeholder: https://github.com/owner/name
    validations:
      required: true
  - type: dropdown
    id: styles
    attributes:
      label: 画风（可多选）
      multiple: true
      options:
        - 数学讲解风
        - 扁平 MG 动效
        - 代码演示风
        - 动态文字 · 歌词
        - 短视频 · 字幕 · 快剪
        - AI 写代码出片
        - 手绘 · 白板 · 水彩
        - 生成艺术 · 几何
        - 着色器 · 迷幻光影
        - Live Coding · VJ
        - 音乐可视化
        - 3D 渲染
        - 二次元 · MMD · VRM
        - 粒子 · 流体 · 物理
        - 故障 · 后期特效
        - 像素 · 复古
        - ASCII · 终端
        - 数据可视化动画
        - 其他（请在说明里写）
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 一句话说明
      description: 它能做出什么样的画面？有作品链接更好。
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: 收录标准
      options:
        - label: 画面由代码绘制或渲染，不依赖视频或图像生成模型
          required: true
        - label: 星数 1000 以上，或近一年内仍有更新且星数 200 以上
          required: false
