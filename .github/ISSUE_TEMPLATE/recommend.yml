name: 推荐项目
description: 推荐一个用代码做动画、做 MV 的开源项目
title: "[推荐] "
labels: ["推荐项目"]
body:
  - type: input
    id: repo
    attributes:
      label: 仓库地址
      placeholder: https://github.com/owner/name
    validations:
      required: true
  - type: dropdown
    id: styles
    attributes:
      label: 画风（可多选）
      multiple: true
      options:
        - 数学讲解风
        - 扁平 MG 动效
        - 代码演示风
        - 动态文字 · 歌词
        - 短视频 · 字幕 · 快剪
        - 手绘 · 白板 · 水彩
        - 生成艺术 · 几何
        - 着色器 · 迷幻光影
        - Live Coding · VJ
        - 音乐可视化
        - 3D 渲染
        - 二次元 · MMD · VRM
        - 粒子 · 流体 · 物理
        - 故障 · 后期特效
        - 像素 · 复古
        - ASCII · 终端
        - 数据可视化动画
        - 水墨 · 山水（小众）
        - 汉字 · 手写笔画（小众）
        - 示波器 · 矢量光线（小众）
        - 绘图仪 · 单线画（小众）
        - 抖动 · 1-bit（小众）
        - Riso · 剪纸拼贴（小众）
        - 人工生命 · 元胞自动机（小众）
        - 程序化生成 · 波函数坍缩（小众）
        - 分形 · 数学艺术（小众）
        - 等距 · 体素（小众）
        - 科幻 HUD · 赛博界面（小众）
        - 地图 · 路线动画（小众）
        - Demoscene 演示场景（小众）
        - 其他（请在说明里写）
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 一句话说明
      description: 它能做出什么样的画面？有作品链接更好。和已收录的哪个项目有关系（基于、插件、同类）也可以写上。
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: 收录标准
      options:
        - label: 画面由代码绘制或渲染，不依赖视频或图像生成模型，也不靠 Blender 等 3D 软件出画面
          required: true
        - label: 星数 1000 以上，或近一年内有更新且星数 200 以上（小众画风：近一年内有更新且星数 20 以上；Claude / Opus 写代码出片的项目：50 以上）
          required: false
